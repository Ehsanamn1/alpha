name: Build and publish Alpha release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            label: Windows-x64
          - goos: linux
            goarch: amd64
            ext: ''
            label: Linux-x64
          - goos: linux
            goarch: arm64
            ext: ''
            label: Linux-ARM64
          - goos: darwin
            goarch: amd64
            ext: ''
            label: macOS-Intel
          - goos: darwin
            goarch: arm64
            ext: ''
            label: macOS-Apple-Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test source
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -race ./... && go vet ./...
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p release
          go build -trimpath -ldflags="-s -w" -o "release/alpha-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/resilience
      - name: Add Windows launchers
        if: matrix.goos == 'windows'
        run: cp Start-Alpha.bat Start-Alpha-Managed-Engines.bat release/
      - name: Package release asset
        env:
          ASSET_LABEL: ${{ matrix.label }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp README_FA.md README.md CHANGELOG.md SECURITY.md LICENSE THIRD_PARTY_NOTICES.md config.example.json release/
          cp -R configs docs release/
          cd release
          sha256sum alpha-* > SHA256SUMS.txt
          zip -rq "$GITHUB_WORKSPACE/Alpha-${ASSET_LABEL}-${VERSION}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-${{ matrix.label }}
          path: Alpha-${{ matrix.label }}-*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Alpha-*
          merge-multiple: true
      - name: Generate package checksums
        run: cd release-assets && sha256sum Alpha-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
