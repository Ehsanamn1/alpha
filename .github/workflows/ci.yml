name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/resilience
