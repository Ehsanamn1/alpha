name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/resilience
      - name: Validate browser assets and PWA manifest
        run: |
          node --check internal/localui/web/app.js
          node --check internal/localui/web/sw.js
          node --check site/sw.js
          test -s site/index.html
          test -s site/icon.svg
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('site/manifest.webmanifest','utf8')); if(m.start_url!=='./'||m.scope!=='./'||!m.icons?.length) process.exit(1)"
          grep -q 'https://ehsanamn1.github.io/alpha/' README_FA.md
