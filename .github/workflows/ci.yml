name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            while IFS= read -r file; do gofmt -d "$file"; done <<< "$unformatted"
            exit 1
          fi
      - name: Install pinned sing-box config verifier
        run: |
          set -euxo pipefail
          archive="/tmp/sing-box-1.14.2-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz" -o "$archive"
          echo "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  $archive" | sha256sum --check -
          mkdir -p /tmp/sing-box-verifier
          tar -xzf "$archive" -C /tmp/sing-box-verifier
          binary="$(find /tmp/sing-box-verifier -type f -name sing-box -perm -u+x | head -n 1)"
          test -n "$binary"
          sudo install "$binary" /usr/local/bin/sing-box
          sing-box version
      - name: Unit and integration tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/resilience
      - name: Validate browser assets and PWA manifest
        run: |
          node --check internal/localui/web/app.js
          node --check internal/localui/web/sw.js
          node --check site/sw.js
          test -s site/index.html
          test -s site/icon.svg
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('site/manifest.webmanifest','utf8')); if(m.start_url!=='./'||m.scope!=='./'||!m.icons?.length) process.exit(1)"
          grep -q 'https://ehsanamn1.github.io/alpha/' README_FA.md

  windows-e2e:
    name: End-to-end source fallback (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install pinned sing-box 1.14.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box-1.14.2-windows-amd64.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'sing-box-e2e'
          Invoke-WebRequest -Uri 'https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-windows-amd64.zip' -OutFile $archive
          $expected = 'c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32'
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "sing-box archive checksum mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Recurse -Filter 'sing-box.exe' | Select-Object -First 1
          if (-not $exe) { throw 'sing-box.exe missing from official archive' }
          Copy-Item $exe.FullName (Join-Path $env:GITHUB_WORKSPACE 'sing-box.exe') -Force
          $env:GITHUB_WORKSPACE | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $env:GITHUB_WORKSPACE 'sing-box.exe') version
      - name: Run real-engine source-fetch E2E
        run: go test -v ./internal/subscriptions -run "^TestSourceFetchFallbackEndToEndThroughAlphaAndSingBox$" -count=1
