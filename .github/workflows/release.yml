name: Build and publish Alpha release

# Publishing a release is explicit: update release.version on main.
# The release action creates the matching vX.Y.Z tag at this commit.
on:
  push:
    branches: [main]
    paths:
      - 'release.version'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release.version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release.version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

  build:
    needs: prepare
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            label: Windows-x64
          - goos: linux
            goarch: amd64
            ext: ''
            label: Linux-x64
          - goos: linux
            goarch: arm64
            ext: ''
            label: Linux-ARM64
          - goos: darwin
            goarch: amd64
            ext: ''
            label: macOS-Intel
          - goos: darwin
            goarch: arm64
            ext: ''
            label: macOS-Apple-Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test source
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -race ./... && go vet ./...
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p release
          go build -trimpath -ldflags="-s -w" -o "release/alpha-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/resilience
      - name: Package release asset
        env:
          ASSET_LABEL: ${{ matrix.label }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euxo pipefail
          cp README_FA.md README.md CHANGELOG.md SECURITY.md LICENSE THIRD_PARTY_NOTICES.md config.example.json release/
          cp -R configs docs release/
          if [ "${{ matrix.goos }}" = windows ]; then
            cp Start-Alpha.bat Start-Alpha-Managed-Engines.bat release/
          fi
          cd release
          sha256sum alpha-* > SHA256SUMS.txt
          zip -rq "$GITHUB_WORKSPACE/Alpha-${ASSET_LABEL}-${VERSION}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-${{ matrix.label }}
          path: Alpha-${{ matrix.label }}-*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Alpha-*
          merge-multiple: true
      - name: Package source archive and all-in-one bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euxo pipefail
          git archive --format=zip --prefix="Alpha-${VERSION}/" HEAD > "release-assets/Alpha-${VERSION}-source.zip"
          mkdir -p /tmp/alpha-bundle/source /tmp/alpha-bundle/dist
          unzip -q "release-assets/Alpha-${VERSION}-source.zip" -d /tmp/alpha-bundle/source
          unzip -p "release-assets/Alpha-Windows-x64-${VERSION}.zip" alpha-windows-amd64.exe > /tmp/alpha-bundle/dist/alpha-windows-amd64.exe
          unzip -p "release-assets/Alpha-Linux-x64-${VERSION}.zip" alpha-linux-amd64 > /tmp/alpha-bundle/dist/alpha-linux-amd64
          unzip -p "release-assets/Alpha-Linux-ARM64-${VERSION}.zip" alpha-linux-arm64 > /tmp/alpha-bundle/dist/alpha-linux-arm64
          unzip -p "release-assets/Alpha-macOS-Intel-${VERSION}.zip" alpha-darwin-amd64 > /tmp/alpha-bundle/dist/alpha-macos-intel
          unzip -p "release-assets/Alpha-macOS-Apple-Silicon-${VERSION}.zip" alpha-darwin-arm64 > /tmp/alpha-bundle/dist/alpha-macos-arm64
          cp "release-assets/Alpha-${VERSION}-source.zip" /tmp/alpha-bundle/
          (cd /tmp/alpha-bundle && zip -rq "$GITHUB_WORKSPACE/release-assets/Alpha-${VERSION}-bundle.zip" .)
          (cd release-assets && sha256sum Alpha-*.zip > SHA256SUMS.txt)
      - name: Publish release and artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Alpha ${{ needs.prepare.outputs.version }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
